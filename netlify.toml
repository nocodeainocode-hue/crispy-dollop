# Netlify: landing sayfası (site/). Bağımlılık yok; build yalnızca Node ile HTML üretir.
[build]
  base = "site"
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://quitvow.com.tr"

# Blog yazısının eski adresi → yeni (SEO uyumlu) adres
[[redirects]]
  from = "/kumari-birakmak/"
  to = "/kumari-birakmak-istiyorum/"
  status = 301
  force = true
